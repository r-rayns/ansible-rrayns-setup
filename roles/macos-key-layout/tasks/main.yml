---
# MacOS UK keyboard mode via keyd

- name: Check if keyd is already installed
  stat:
    path: /usr/local/bin/keyd
  register: keyd_installed

- name: Install build dependencies for keyd
  apt:
    name:
      - git
      - make
      - gcc
    state: present
  become: true
  when: not keyd_installed.stat.exists

- name: Clone keyd repository
  git:
    repo: https://github.com/rvaiya/keyd.git
    dest: /tmp/keyd
    depth: 1
    version: master
  when: not keyd_installed.stat.exists

- name: Build and install keyd
  shell: make && sudo make install
  args:
    chdir: /tmp/keyd
  become: true
  when: not keyd_installed.stat.exists

- name: Clean up keyd source
  file:
    path: /tmp/keyd
    state: absent
  when: not keyd_installed.stat.exists

- name: Deploy keyd MacOS UK configuration
  copy:
    src: keyd-macos-uk.conf
    dest: /etc/keyd/default.conf
    mode: "0644"
  become: true
  notify: restart keyd

- name: Enable and start keyd service
  systemd:
    name: keyd
    enabled: true
    state: started
  become: true
